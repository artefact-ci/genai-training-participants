<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace conseiller</title>
<style>
  :root {
    --fond: #f4f6f8; --surface: #ffffff; --texte: #18212b; --doux: #5b6672; --trait: #e1e6eb;
    --marque: #0b5e55; --marque-clair: #e3f1ee; --refus: #b42318; --refus-clair: #fdecea;
    --attente: #b54708; --attente-clair: #fef3e2; --info: #175cd3; --info-clair: #eaf1fd;
    --bulle-client: #f0f2f4; --ombre: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1418; --surface: #182027; --texte: #e6ebef; --doux: #95a1ad; --trait: #2a343d;
      --marque: #3fb8a4; --marque-clair: #16322e; --refus: #f97066; --refus-clair: #3a1d1b;
      --attente: #fdb022; --attente-clair: #3a2a10; --info: #84adff; --info-clair: #19253d;
      --bulle-client: #222c35; --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--trait); }
  .barre { max-width: 900px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 650; }
  .logo span { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--marque); color: #fff; font-size: 14px; }
  .logo small { display: block; font-weight: 400; color: var(--doux); font-size: 12px; }
  .identite { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--doux); font-size: 13px; }
  .identite input { width: 92px; padding: 6px 8px; border: 1px solid var(--trait); border-radius: 6px; background: var(--fond); color: var(--texte); font: inherit; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  .entete { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .compteur { background: var(--attente-clair); color: var(--attente); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .compteur.vide { background: var(--marque-clair); color: var(--marque); }
  .direct { margin-left: auto; display: flex; align-items: center; gap: 6px; color: var(--doux); font-size: 13px; }
  .direct i { width: 8px; height: 8px; border-radius: 50%; background: var(--marque); animation: pouls 2s infinite; }
  .direct.coupe i { background: var(--refus); animation: none; }
  @keyframes pouls { 50% { opacity: .3; } }
  .carte { background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; box-shadow: var(--ombre); margin-bottom: 16px; overflow: hidden; }
  .carte.nouvelle { animation: arrivee .5s ease-out; }
  @keyframes arrivee { from { transform: translateY(-6px); opacity: 0; } }
  .carte-tete { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--trait); flex-wrap: wrap; }
  .client { font-weight: 650; margin-right: 4px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--fond); color: var(--doux); border: 1px solid var(--trait); white-space: nowrap; }
  .badge.type-validation { background: var(--attente-clair); color: var(--attente); border-color: transparent; font-weight: 600; }
  .badge.type-transfert { background: var(--info-clair); color: var(--info); border-color: transparent; font-weight: 600; }
  .badge.type-encours { background: var(--marque-clair); color: var(--marque); border-color: transparent; font-weight: 600; }
  .badge.urgence-critique { background: var(--refus-clair); color: var(--refus); border-color: transparent; font-weight: 600; }
  .badge.urgence-haute { background: var(--attente-clair); color: var(--attente); border-color: transparent; }
  .heure { margin-left: auto; color: var(--doux); font-size: 13px; }
  .carte-corps { padding: 16px 18px; }
  .titre-dossier { font-weight: 600; margin: 0 0 12px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 14px; }
  dt { color: var(--doux); }
  dd { margin: 0; word-break: break-word; }
  dd.code { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 14px; }
  .encadre { margin: 0 0 12px; padding: 10px 14px; background: var(--fond); border-left: 3px solid var(--marque); border-radius: 0 8px 8px 0; }
  .encadre b { display: block; font-size: 12px; color: var(--doux); font-weight: 600; margin-bottom: 2px; }
  .encadre:last-child { margin-bottom: 0; }
  .fil { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding: 4px 2px; margin-top: 4px; }
  .bulle { max-width: 78%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .bulle small { display: block; font-size: 11px; color: var(--doux); margin-bottom: 2px; }
  .bulle.client { align-self: flex-start; background: var(--bulle-client); border-bottom-left-radius: 4px; }
  .bulle.assistant { align-self: flex-end; background: var(--fond); border: 1px dashed var(--trait); border-bottom-right-radius: 4px; color: var(--doux); }
  .bulle.conseiller { align-self: flex-end; background: var(--marque-clair); border-bottom-right-radius: 4px; }
  .carte-pied { display: flex; gap: 10px; padding: 12px 18px; background: var(--fond); border-top: 1px solid var(--trait); flex-wrap: wrap; align-items: flex-start; }
  button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; border: 1px solid transparent; }
  button:disabled { opacity: .55; cursor: wait; }
  .principal { background: var(--marque); color: #fff; }
  .danger { background: transparent; color: var(--refus); border-color: var(--refus); }
  .neutre { background: transparent; color: var(--doux); border-color: var(--trait); }
  .neutre.droite { margin-left: auto; }
  .zone { flex-basis: 100%; display: none; gap: 8px; flex-direction: column; }
  .zone.ouvert { display: flex; }
  .saisie { flex-basis: 100%; display: flex; gap: 8px; align-items: flex-end; }
  textarea { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--trait); border-radius: 8px; background: var(--surface); color: var(--texte); font: inherit; resize: vertical; }
  .zone div { display: flex; gap: 8px; }
  .vide-etat { text-align: center; padding: 48px 16px; color: var(--doux); background: var(--surface); border: 1px dashed var(--trait); border-radius: 12px; }
  .vide-etat b { display: block; color: var(--texte); font-size: 16px; margin-bottom: 4px; }
  .message { border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; border: 1px solid; }
  .message.ok { background: var(--marque-clair); border-color: var(--marque); }
  .message.ko { background: var(--refus-clair); border-color: var(--refus); }
  .message b { display: block; margin-bottom: 4px; }
  .message q { display: block; quotes: none; }
  h2 { font-size: 15px; margin: 32px 0 10px; color: var(--doux); font-weight: 600; }
  .historique { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--trait); border-radius: 12px; }
  .historique li { display: flex; gap: 12px; padding: 10px 18px; border-top: 1px solid var(--trait); font-size: 14px; flex-wrap: wrap; }
  .historique li:first-child { border-top: 0; }
  .historique .etat { font-weight: 600; min-width: 86px; }
  .historique .etat.oui { color: var(--marque); }
  .historique .etat.non { color: var(--refus); }
  .historique .quand { margin-left: auto; color: var(--doux); }
  .erreur { padding: 16px 18px; border-radius: 12px; background: var(--refus-clair); color: var(--refus); }
  @media (max-width: 560px) { dl { grid-template-columns: 1fr; gap: 0; } dd { margin-bottom: 8px; } .identite { margin-left: 0; } .bulle { max-width: 92%; } }
</style>
</head>
<body>
<header>
  <div class="barre">
    <div class="logo"><span>LB</span><div>Lagune Banque<small>Espace conseiller</small></div></div>
    <label class="identite">Conseiller <input id="conseiller" value="CONS-01" autocomplete="off"></label>
  </div>
</header>
<main>
  <div class="entete">
    <h1>Demandes transmises par l'assistant</h1>
    <span id="compteur" class="compteur">…</span>
    <span id="direct" class="direct"><i></i><span>Mise à jour automatique</span></span>
  </div>
  <div id="retour"></div>
  <div id="liste"></div>
  <h2 id="titre-historique" hidden>Traitées pendant la session</h2>
  <ul id="historique" class="historique" hidden></ul>
</main>
<script>
const IDENTIFIANTS = {pret_id: "Prêt", echeance_id: "Échéance", transaction_id: "Transaction Lagune Money", incident_id: "Incident plateforme"};
const ACTIONS = {propose_regularisation: "Régularisation : rattacher le paiement, annuler les frais de retard, lever la suspension"};
const PARCOURS = {P1: "Question sur les services", P2: "Échéance", P3: "Réclamation", P4: "Hors périmètre", P5: "Opération non reconnue"};
const CANAUX = {whatsapp: "WhatsApp"};
const AUTEURS = {client: "Client", assistant: "Assistant", conseiller: "Conseiller"};
const vus = new Set();
let premierChargement = true, signature = "";

const el = (balise, classe, texte) => {
  const e = document.createElement(balise);
  if (classe) e.className = classe;
  if (texte !== undefined && texte !== null) e.textContent = texte;
  return e;
};
const heure = (d = new Date()) => d.toLocaleTimeString("fr-FR", {hour: "2-digit", minute: "2-digit"});
const masque = n => n && String(n).length > 4 ? "•••• " + String(n).slice(-4) : (n || "");
const qui = () => document.getElementById("conseiller").value.trim() || "CONS-01";
const plein = v => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);

async function appel(url, corps) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corps || {})});
  if (!r.ok) { let t = await r.text(); try { t = JSON.parse(t).detail || t; } catch {} throw new Error(t); }
  return r.json();
}

function tete(x, badges) {
  const t = el("div", "carte-tete");
  t.append(el("span", "client", "Client " + x.client_id), ...badges, el("span", "badge", CANAUX[x.canal] || x.canal));
  if (x.utilisateur) t.append(el("span", "badge", masque(x.utilisateur)));
  t.append(el("span", "heure", x.recu_le ? "Reçu à " + heure(new Date(x.recu_le)) : ""));
  return t;
}

function identifiants(d) {
  const dl = el("dl");
  for (const [cle, libelle] of Object.entries(IDENTIFIANTS))
    if (plein(d[cle])) dl.append(el("dt", "", libelle), el("dd", "code", d[cle]));
  return dl;
}

function encadre(titre, texte) {
  const p = el("p", "encadre");
  p.append(el("b", "", titre), document.createTextNode(texte));
  return p;
}

// ------------------------------------------------------------ validation d'une action de l'agent
function carteValidation(x) {
  const d = x.dossier || {};
  const c = el("article", "carte");
  c.dataset.cle = "v:" + x.session;
  c.append(tete(x, [el("span", "badge type-validation", "Validation requise")]));
  const corps = el("div", "carte-corps");
  corps.append(el("p", "titre-dossier", ACTIONS[d.action] || d.action || "Action à valider"), identifiants(d));
  if (d.justification) corps.append(encadre("Justification de l'assistant", d.justification));

  const pied = el("div", "carte-pied");
  const ok = el("button", "principal", "Valider"), non = el("button", "danger", "Refuser");
  const zone = el("div", "zone"), motif = el("textarea"), btns = el("div");
  motif.placeholder = "Motif du refus, transmis à l'assistant";
  motif.dataset.brouillon = "motif:" + x.session;
  const confirmer = el("button", "danger", "Confirmer le refus"), annuler = el("button", "neutre", "Annuler");
  btns.append(confirmer, annuler); zone.append(motif, btns);
  const tous = [ok, non, confirmer];
  ok.onclick = () => decider(x, true, "", tous);
  non.onclick = () => { zone.classList.add("ouvert"); motif.focus(); };
  annuler.onclick = () => { zone.classList.remove("ouvert"); motif.value = ""; delete brouillons["motif:" + x.session]; };
  confirmer.onclick = () => decider(x, false, motif.value.trim(), tous);
  pied.append(ok, non, zone);
  c.append(corps, pied);
  return c;
}

async function decider(x, approuve, motif, boutons) {
  boutons.forEach(b => b.disabled = true);
  try {
    const rep = await appel("/conseiller/validations/" + encodeURIComponent(x.session) + "/decision", {approuve, conseiller: qui(), motif});
    afficher("ok", (approuve ? "Régularisation validée" : "Demande refusée") + " pour le client " + x.client_id,
             "Message envoyé au client :", rep.message_au_client);
    historiser(approuve ? "Validé" : "Refusé", approuve, x);
  } catch (e) {
    afficher("ko", "La décision n'a pas pu être enregistrée", "", e.message);
    boutons.forEach(b => b.disabled = false);
  }
  charger(true);
}

// ------------------------------------------------------------ dossier transmis : échange avec le client
function carteTransfert(x) {
  const d = x.dossier || {};
  const enCours = x.statut === "en_cours";
  const c = el("article", "carte");
  c.dataset.cle = "t:" + x.reference;
  const badges = [el("span", enCours ? "badge type-encours" : "badge type-transfert", enCours ? "En cours · " + (x.conseiller || "") : "Dossier transmis"),
                  el("span", "badge", x.reference)];
  if (d.urgence && d.urgence !== "normale") badges.push(el("span", "badge urgence-" + d.urgence, "Urgence " + d.urgence));
  c.append(tete(x, badges));

  const corps = el("div", "carte-corps");
  corps.append(el("p", "titre-dossier", PARCOURS[d.parcours] || "Demande du client"));
  if (d.resume) corps.append(encadre("Résumé de l'assistant", d.resume));
  if (plein(d.demande_client)) corps.append(encadre("Demande du client", d.demande_client));
  const dl = identifiants(d);
  if (plein(d.elements_verifies)) dl.append(el("dt", "", "Déjà vérifié"), el("dd", "", [].concat(d.elements_verifies).join(", ")));
  if (dl.childElementCount) corps.append(dl);

  const messages = x.messages || [];
  if (messages.length) {
    const fil = el("div", "fil");
    for (const m of messages) {
      const b = el("div", "bulle " + m.de);
      b.append(el("small", "", (AUTEURS[m.de] || m.de) + (m.heure ? " · " + m.heure : "")), document.createTextNode(m.texte));
      fil.append(b);
    }
    corps.append(fil);
  }

  const pied = el("div", "carte-pied");
  if (!enCours) {
    const prendre = el("button", "principal", "Prendre en charge");
    prendre.onclick = async () => {
      prendre.disabled = true;
      try {
        const rep = await appel("/conseiller/transferts/" + encodeURIComponent(x.reference) + "/prise-en-charge", {conseiller: qui()});
        afficher("ok", "Dossier " + x.reference + " pris en charge", "L'assistant s'est retiré. Message envoyé au client :", rep.message_au_client);
      } catch (e) { afficher("ko", "Prise en charge impossible", "", e.message); prendre.disabled = false; }
      charger(true);
    };
    pied.append(prendre, el("span", "", ""));
    pied.lastChild.style.cssText = "align-self:center;color:var(--doux);font-size:13px";
    pied.lastChild.textContent = "L'assistant se retire et vous écrivez directement au client.";
  } else {
    const saisie = el("div", "saisie"), zone = el("textarea"), envoyer = el("button", "principal", "Envoyer");
    zone.placeholder = "Votre message au client";
    zone.dataset.brouillon = "msg:" + x.reference;
    zone.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); envoyer.click(); } };
    envoyer.onclick = async () => {
      const texte = zone.value.trim();
      if (!texte) return;
      envoyer.disabled = true;
      try {
        await appel("/conseiller/transferts/" + encodeURIComponent(x.reference) + "/message", {texte});
        zone.value = ""; delete brouillons["msg:" + x.reference];
      } catch (e) { afficher("ko", "Message non envoyé", "", e.message); }
      envoyer.disabled = false;
      charger(true, "msg:" + x.reference);
    };
    saisie.append(zone, envoyer);
    const clore = el("button", "neutre droite", "Clore et rendre la main à l'assistant");
    clore.onclick = async () => {
      clore.disabled = true;
      try {
        const rep = await appel("/conseiller/transferts/" + encodeURIComponent(x.reference) + "/cloture");
        afficher("ok", "Dossier " + x.reference + " clos", "Message envoyé au client :", rep.message_au_client);
        historiser("Clos", true, x);
      } catch (e) { afficher("ko", "Clôture impossible", "", e.message); clore.disabled = false; }
      charger(true);
    };
    pied.append(saisie, clore);
  }
  c.append(corps, pied);
  return c;
}

// ------------------------------------------------------------ affichage
function afficher(type, titre, sous, texte) {
  const m = el("div", "message " + type);
  m.append(el("b", "", titre));
  if (sous) m.append(el("span", "", sous));
  if (texte) m.append(el("q", "", texte));
  document.getElementById("retour").replaceChildren(m);
}

function historiser(etat, ok, x) {
  const ul = document.getElementById("historique"), li = el("li");
  li.append(el("span", "etat " + (ok ? "oui" : "non"), etat),
            el("span", "", "Client " + x.client_id + (x.reference ? " · " + x.reference : "") + " · par " + qui()),
            el("span", "quand", heure()));
  ul.prepend(li);
  ul.hidden = false;
  document.getElementById("titre-historique").hidden = false;
}

const brouillons = {};
async function charger(force = false, focus = null) {
  const liste = document.getElementById("liste"), direct = document.getElementById("direct"), compteur = document.getElementById("compteur");
  let validations, transferts;
  try {
    const [rv, rt] = await Promise.all([fetch("/conseiller/validations", {cache: "no-store"}), fetch("/conseiller/transferts", {cache: "no-store"})]);
    if (rv.status === 403 || rt.status === 403) {
      liste.replaceChildren(el("div", "erreur", "Accès refusé : cette page ne s'ouvre que sur la machine qui exécute le service."));
      return;
    }
    [validations, transferts] = [await rv.json(), await rt.json()];
    direct.classList.remove("coupe");
    direct.lastElementChild.textContent = "Mise à jour à " + heure();
  } catch {
    direct.classList.add("coupe");
    direct.lastElementChild.textContent = "Service injoignable";
    return;
  }
  const nouvelle = JSON.stringify([validations, transferts]);
  if (!force && nouvelle === signature) return;             // rien n'a changé : on ne touche pas à la page
  signature = nouvelle;

  // garder ce qui est en cours de saisie
  const actif = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.brouillon : null;
  document.querySelectorAll("textarea[data-brouillon]").forEach(t => { if (t.value) brouillons[t.dataset.brouillon] = t.value; });

  const dossiers = [...validations.map(x => ({type: "v", cle: "v:" + x.session, x})),
                    ...transferts.map(x => ({type: "t", cle: "t:" + x.reference, x}))]
    .sort((a, b) => (b.x.recu_le || "").localeCompare(a.x.recu_le || ""));
  const aTraiter = validations.length + transferts.filter(t => t.statut !== "en_cours").length;
  const enCours = transferts.length - transferts.filter(t => t.statut !== "en_cours").length;
  compteur.textContent = dossiers.length ? [aTraiter && aTraiter + " à traiter", enCours && enCours + " en cours"].filter(Boolean).join(" · ") : "Aucune demande";
  compteur.classList.toggle("vide", !aTraiter);

  if (!dossiers.length) {
    const v = el("div", "vide-etat");
    v.append(el("b", "", "Aucune demande en cours"),
             document.createTextNode("Les dossiers transmis par l'assistant et les actions à valider apparaîtront ici."));
    liste.replaceChildren(v);
  } else {
    liste.replaceChildren(...dossiers.map(({type, cle, x}) => {
      const c = type === "v" ? carteValidation(x) : carteTransfert(x);
      if (!premierChargement && !vus.has(cle)) c.classList.add("nouvelle");
      vus.add(cle);
      return c;
    }));
  }
  document.querySelectorAll("textarea[data-brouillon]").forEach(t => {
    const b = brouillons[t.dataset.brouillon];
    if (b) { t.value = b; const z = t.closest(".zone"); if (z) z.classList.add("ouvert"); }
  });
  document.querySelectorAll(".fil").forEach(f => f.scrollTop = f.scrollHeight);
  const cible = focus || actif;
  if (cible) { const t = document.querySelector(`textarea[data-brouillon="${CSS.escape(cible)}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
  premierChargement = false;
}

document.addEventListener("input", e => { if (e.target.dataset && e.target.dataset.brouillon) brouillons[e.target.dataset.brouillon] = e.target.value; });
charger(true);
setInterval(charger, 3000);
</script>
</body>
</html>
